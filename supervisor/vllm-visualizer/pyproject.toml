[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-visualizer"
version = "0.1.0"
description = "vLLM neuron-map visualizer plugin (prototype)"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
visualizer = "vllm_visualizer:register"

[tool.setuptools]
packages = ["vllm_visualizer"]
