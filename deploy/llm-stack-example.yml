# Example full stack: this dashboard deployed alongside a real vLLM backend
# (vllm-scaler) and llama-swap on the same host. Paths, image tags, GPU device
# passthrough, and model flags below are specific to one real deployment — treat
# this as a reference to adapt, not a drop-in file.
#
# Key point: vllm-scaler and llama-swap use network_mode: host, so dashboard does
# too — otherwise it can't reliably reach vllm-scaler's port from a separate bridge
# network. postgres is host-networked as well: reaching it only through Docker's
# published-port/NAT path (bridge network + 127.0.0.1:5432 publish) let a pooled
# connection get silently reset by that layer while idle between queries, corrupting
# it for the next request that reused it — seen in production as a Blazor Server
# circuit dying mid-request with an Npgsql "operation cancelled"/connection-corruption
# error. With postgres also host-networked, the connection is genuine loopback the
# whole way, no NAT involved. Since host-networked containers aren't part of any
# Compose bridge network, dashboard can't resolve postgres by its Compose service
# name either way — it connects via 127.0.0.1 in both cases.

version: "3.8"
services:

  vllm-scaler:
    image: intel/llm-scaler-vllm:0.21.0-b3
    container_name: vllm-scaler
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /dev/dri/by-path:/dev/dri/by-path
      - /media/external6tb/llm-models/hf-cache/Qwen3.8-27B-INT4:/models/qwen3.8-int4
    ipc: host
    privileged: true
    entrypoint: ["vllm"]
    command:
      - serve
      - /models/qwen3.8-int4
      - --served-model-name
      - qwen3.8-vllm
      - --port
      - "9999"
      - --dtype
      - float16
      - --gpu-memory-utilization
      - "0.80"
      - --max-model-len
      - "131072"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --mm-encoder-tp-mode
      - data

  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:vulkan
    container_name: llama-swap
    restart: unless-stopped
    network_mode: host
    volumes:
      - /media/external6tb/docker-compose/llama-swap-config.yaml:/app/config.yaml
    command: ["-config", "/app/config.yaml", "-listen", "0.0.0.0:8990"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    # Host networking, matching dashboard below — a pooled connection to postgres
    # published only via Docker's iptables/NAT layer (the previous setup: postgres on
    # the bridge network, reached through 127.0.0.1:5432) can get silently reset by
    # that layer while sitting idle between queries, corrupting the connection for
    # whatever request reuses it next. Host networking end-to-end makes it genuine
    # loopback the whole way, with no NAT involved at all.
    network_mode: host
    # listen_addresses is explicit here because host networking otherwise exposes
    # Postgres's own default (all interfaces) to the entire LAN, not just loopback.
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - /media/external6tb/app-data/vLLM-Dashboard/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    image: lanedfritz/vllm-dashboard:latest
    restart: unless-stopped
    # Host networking so it can reach vllm-scaler/llama-swap directly (they're also
    # host-networked) without relying on this host's mDNS name resolving from inside
    # a bridge-networked container.
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=dashboard;Username=dashboard;Password=dashboard"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      DATAPROTECTION_KEYS_DIR: /data/dataprotection
      # Only needed for a source you want to hot-swap models on, e.g. tcp://127.0.0.1:2375
      DOCKER_HOST: ""
    volumes:
      - dataprotection:/data

volumes:
  dataprotection:
