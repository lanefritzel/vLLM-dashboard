# P16a test deployment -- a throwaway stack run alongside (never replacing)
# the live llm-stack Portainer project, on its own network/ports/volumes so
# nothing here can collide with it. Goal is to prove the new supervisor-based
# dashboard end to end against the real GPU and a real model before any
# cutover. See plan/live-compose-reference.md for the target this reproduces,
# and the Build Plan's P16a doc for the full rehearsal steps/DoD.
#
# Brought up in two stages on purpose:
#   1. postgres + dashboard first -- confirms migrations/conversion run clean
#      against a fresh DB with zero GPU risk.
#   2. supervisor, once (1) looks right -- this is the step that touches the
#      GPU, so it's deliberately not auto-started with the rest.
#
# Usage (run from this directory on tes.home):
#   docker compose -f docker-compose.p16a-test.yml up -d --build postgres dashboard
#   docker compose -f docker-compose.p16a-test.yml up -d --build supervisor
#
# The live stack must be stopped before bringing up `supervisor` -- it holds
# the GPU (network_mode: host, /dev/dri) and only one vLLM process fits at a
# time on this hardware.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - p16a-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - p16a-net
    # Published to loopback only, on a port distinct from the live stack's own
    # postgres (which may also be running on 5432) -- the dashboard below now
    # reaches this over 127.0.0.1 instead of the bridge network's DNS name,
    # since it had to move to network_mode: host for an unrelated reason (see
    # that service's own comment) and host networking can't mix with a
    # service still living on this bridge network.
    ports:
      - "127.0.0.1:15432:5432"

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=15432;Database=dashboard;Username=dashboard;Password=dashboard"
      ASPNETCORE_ENVIRONMENT: Production
      # Deliberately NOT 8080/8445 -- those are the live dashboard's ports;
      # kept distinct so there's no collision even if the live stack comes
      # back up mid-test. No HTTPS for this smoke test (no cert needed).
      # With network_mode: host below, this binds directly on the host --
      # there's no Compose port-mapping step to do it instead. Must override
      # Kestrel__Endpoints__Http__Url specifically, not ASPNETCORE_URLS --
      # the Dockerfile bakes the former into the image as its own env var,
      # and it wins over ASPNETCORE_URLS when both are set (confirmed the
      # hard way: with only ASPNETCORE_URLS set here, the container kept
      # listening on 8080 anyway, host-network-colliding with the live
      # stack's own dashboard and crash-looping on bind failure).
      Kestrel__Endpoints__Http__Url: "http://+:18080"
      DATAPROTECTION_KEYS_DIR: /data/dataprotection
      # No hot-swap DockerOrchestrator path needed anymore -- registration
      # happens through the Servers page (P15b) against the supervisor below.
      DOCKER_HOST: ""
      # Same mount point the supervisor below gets, read-only here too --
      # lets the Servers/Add-model folder picker browse real paths instead
      # of a free-text field a user can fat-finger.
      MODELS_BROWSE_ROOT: /models
    # The supervisor's admin API binds to 127.0.0.1 only (not configurable
    # from the published image -- see supervisor.py's ADMIN_BIND_HOST), which
    # only means "this host's real loopback" if the dashboard shares that
    # same network namespace. On the bridge network this service used to sit
    # on, "the host" was reachable only via a NAT'd gateway alias
    # (host.docker.internal), which is a different interface than loopback as
    # far as a loopback-bound socket is concerned -- confirmed directly, that
    # path gets a connection reset, not just a slow timeout. network_mode:
    # host makes this container's 127.0.0.1 the literal same loopback the
    # supervisor binds to, matching the real target topology anyway (see
    # llm-stack-example.yml, which runs the whole stack this way). When
    # registering the instance on the Servers page, the admin URL is now
    # simply http://127.0.0.1:18001 -- no more host.docker.internal alias.
    network_mode: host
    volumes:
      - p16a-dataprotection:/data
      - /home/lanef/hf-models:/models:ro

  supervisor:
    build:
      context: ../supervisor
      dockerfile: Dockerfile
      # Must match the live host's actual base image/driver version, not the
      # Dockerfile's own default (0.21.0-b3) -- confirmed via `docker inspect`
      # against the running llm-stack_vllm-scaler container.
      args:
        BASE_IMAGE: intel/llm-scaler-vllm:0.26.0-b2
    restart: "no"
    # Matches the real target topology (plan/live-compose-reference.md):
    # the GPU device + ipc + privileged requirements are the same whether
    # vLLM is launched directly (today's prod) or via the supervisor (P16a).
    network_mode: host
    devices:
      - /dev/dri
    volumes:
      - /dev/dri/by-path:/dev/dri/by-path
      - p16a-state:/state
      # Models root, not a single per-model mount -- the supervisor resolves
      # MODELS_ROOT + the recipe's own relative path at deploy time.
      - /home/lanef/hf-models:/models:ro
    ipc: host
    privileged: true
    init: true
    environment:
      ADMIN_PORT: "18001"
      # Supervisor is on host network -- the dashboard's published port is
      # reachable via localhost on the same host.
      DASHBOARD_EVENT_URL: "http://127.0.0.1:18080/internal/supervisor-events"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"

networks:
  p16a-net:
    driver: bridge

volumes:
  p16a-pgdata:
  p16a-dataprotection:
  p16a-state:
