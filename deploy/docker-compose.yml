services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Internal only: not published.
    expose:
      - "5432"

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=dashboard;Username=dashboard;Password=dashboard"
      ASPNETCORE_ENVIRONMENT: Production
      DATAPROTECTION_KEYS_DIR: /data/dataprotection
      # Only needed for a source you want to hot-swap models on, e.g. tcp://<servername-or-ip>:2375
      DOCKER_HOST: ""
      # HTTPS, served alongside HTTP on 8080 (not a redirect -- both stay live).
      # Certificate/KeyPath here is for a PEM cert+key pair; swap for
      # Certificate__Path + Certificate__Password if yours is a PFX instead.
      Kestrel__Endpoints__Https__Url: "https://+:8445"
      Kestrel__Endpoints__Https__Certificate__Path: /certs/tes.home.pem
      Kestrel__Endpoints__Https__Certificate__KeyPath: /certs/tes.home.key
      # Mount the same host directory below as the supervisor's own
      # MODELS_ROOT (same path on both sides) to let the Servers/Add-model
      # folder picker browse real paths. Omit both this var and the volume
      # below to fall back to a plain text field -- IFilesystemBrowser
      # degrades gracefully when nothing is mounted at MODELS_BROWSE_ROOT.
      MODELS_BROWSE_ROOT: /models
    ports:
      - "8080:8080"
      - "8445:8445"
    volumes:
      - dataprotection:/data
      # Host directory holding the cert/key issued by your home CA.
      - ../certs:/certs:ro
      # Host models root, read-only -- must match the supervisor's own mount.
      # - /path/to/your/models:/models:ro

volumes:
  pgdata:
  dataprotection:
