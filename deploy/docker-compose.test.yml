# Test-environment compose for P00's gate: postgres + dashboard (built from
# the working tree) + fake vLLM, all on one bridge network. No GPU, no real
# model. The P02 supervisor service below runs the SAME fake vLLM as its own
# spawned child (not a sibling service) -- separate from the standalone
# fake-vllm service the dashboard talks to directly for P00's own smoke test.
# Not used in production -- see deploy/docker-compose.yml for that.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  fake-vllm:
    build:
      context: ../tests/fake-vllm
      dockerfile: Dockerfile
    # No restart policy: a test double that silently restarts hides
    # --fake-crash/--fake-exit-after behavior from whatever's testing against it.
    restart: "no"
    command: ["--host", "0.0.0.0", "--port", "9999", "--served-model-name", "fake-model"]
    expose:
      - "9999"

  # P02: the Python supervisor, spawning the fake vLLM as its own child
  # (not this compose's "fake-vllm" service -- that one's standalone, for the
  # dashboard's own smoke test). Verifies boot replay/state.json/the admin
  # API without needing the real Intel/NVIDIA base image.
  supervisor:
    build:
      context: ..
      dockerfile: supervisor/Dockerfile.test
    init: true  # tini-equivalent PID 1 -- this test image doesn't bake tini in itself
    restart: "no"
    volumes:
      - test-supervisor-state:/state
    command: ["serve", "/models/fake", "--served-model-name", "fake-model", "--port", "9999"]
    expose:
      - "8000"

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      fake-vllm:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=dashboard;Username=dashboard;Password=dashboard"
      ASPNETCORE_ENVIRONMENT: Development
      DATAPROTECTION_KEYS_DIR: /data/dataprotection
    ports:
      - "8080:8080"
    volumes:
      - test-dataprotection:/data

volumes:
  test-dataprotection:
  test-supervisor-state:
